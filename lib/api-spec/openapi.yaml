openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: API para sistema de pesagem de mirtilo
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: workers
    description: Worker management
  - name: weigh-records
    description: Weighing records
  - name: reports
    description: Reports and rankings
  - name: attendance
    description: Daily worker check-in / check-out
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /workers:
    get:
      operationId: listWorkers
      tags: [workers]
      summary: List all workers
      responses:
        "200":
          description: List of workers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Worker"
    post:
      operationId: createWorker
      tags: [workers]
      summary: Create a new worker
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkerBody"
      responses:
        "201":
          description: Worker created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Worker ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workers/{id}:
    get:
      operationId: getWorker
      tags: [workers]
      summary: Get a worker by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Worker found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateWorker
      tags: [workers]
      summary: Update a worker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkerBody"
      responses:
        "200":
          description: Worker updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorker
      tags: [workers]
      summary: Delete a worker
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Worker deleted
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /weigh-records:
    get:
      operationId: listWeighRecords
      tags: [weigh-records]
      summary: List weigh records with optional filters
      parameters:
        - name: workerId
          in: query
          required: false
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date string YYYY-MM-DD
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of weigh records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeighRecord"
    post:
      operationId: createWeighRecord
      tags: [weigh-records]
      summary: Create a weigh record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWeighRecordBody"
      responses:
        "201":
          description: Record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /weigh-records/{id}:
    patch:
      operationId: updateWeighRecord
      tags: [weigh-records]
      summary: Update a weigh record (e.g. correct the weight)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWeighRecordBody"
      responses:
        "200":
          description: Updated record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeighRecord"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWeighRecord
      tags: [weigh-records]
      summary: Delete a weigh record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Record deleted
        "404":
          description: Record not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance:
    get:
      operationId: listAttendance
      tags: [attendance]
      summary: List worker attendance for a given day (defaults to today)
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date YYYY-MM-DD (defaults to today)
      responses:
        "200":
          description: Attendance list with one entry per active worker
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"

  /attendance/check-in:
    post:
      operationId: checkInWorker
      tags: [attendance]
      summary: Check in a single worker for the day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceMutationBody"
      responses:
        "200":
          description: Attendance entry for the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance/check-out:
    post:
      operationId: checkOutWorker
      tags: [attendance]
      summary: Check out a single worker for the day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceMutationBody"
      responses:
        "200":
          description: Attendance entry for the worker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker not checked in today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance/check-in-all:
    post:
      operationId: checkInAll
      tags: [attendance]
      summary: Check in all active workers for the day
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBulkBody"
      responses:
        "200":
          description: Updated attendance list for the day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"

  /attendance/check-out-all:
    post:
      operationId: checkOutAll
      tags: [attendance]
      summary: Check out all currently checked-in workers for the day
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttendanceBulkBody"
      responses:
        "200":
          description: Updated attendance list for the day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttendanceEntry"

  /attendance/shift:
    post:
      operationId: createAttendanceShift
      tags: [attendance]
      summary: Manually create a shift (entrada/saída) for a worker on a day
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftCreateBody"
      responses:
        "201":
          description: The created shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Worker not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Shift conflict (overlap or open shift already exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance/shift/{id}:
    patch:
      operationId: updateAttendanceShift
      tags: [attendance]
      summary: Edit a shift's times or move it to another day
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftUpdateBody"
      responses:
        "200":
          description: The updated shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttendanceEntry"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Shift conflict (overlap or open shift already exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAttendanceShift
      tags: [attendance]
      summary: Delete a shift by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Shift deleted
        "404":
          description: Shift not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /workers/{id}/timesheet:
    get:
      operationId: getWorkerTimesheet
      tags: [workers]
      summary: Get attendance days for a worker in a date range, with hours and pay
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: ISO date YYYY-MM-DD (default 30 days ago)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: ISO date YYYY-MM-DD (default today)
        - name: hourlyRate
          in: query
          required: false
          schema:
            type: number
          description: Optional hourly rate for pay calculation
      responses:
        "200":
          description: Worker timesheet for the period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerTimesheet"
        "404":
          description: Worker not found

  /workers/{id}/timesheet/export:
    get:
      operationId: exportWorkerTimesheet
      tags: [workers]
      summary: Export a worker's timesheet as CSV
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
        - name: to
          in: query
          required: false
          schema:
            type: string
        - name: hourlyRate
          in: query
          required: false
          schema:
            type: number
      responses:
        "200":
          description: CSV file of the worker's timesheet
          content:
            text/csv:
              schema:
                type: string

  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get daily productivity ranking
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date YYYY-MM-DD (defaults to today)
      responses:
        "200":
          description: Daily report with worker rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"

  /reports/export:
    get:
      operationId: exportRecords
      tags: [reports]
      summary: Export records as CSV
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: ISO date YYYY-MM-DD (defaults to today)
        - name: workerId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Worker:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - active
        - createdAt

    CreateWorkerBody:
      type: object
      properties:
        id:
          type: string
          description: Worker identifier (e.g. W001)
        name:
          type: string
      required:
        - id
        - name

    UpdateWorkerBody:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean

    QualityIssue:
      type: string
      enum:
        - CALIBRE
        - PENDUNCULOS
        - VERDE
        - MOLE
        - OUTROS

    WeighRecord:
      type: object
      properties:
        id:
          type: integer
        workerId:
          type: string
        workerName:
          type: string
        timestamp:
          type: string
          format: date-time
        weightGrams:
          type: number
        unit:
          type: string
        scaleId:
          type: string
        rawLine:
          type: string
        syncStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        editedAt:
          type: ["string", "null"]
          format: date-time
        qualityIssues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
      required:
        - id
        - workerId
        - workerName
        - timestamp
        - weightGrams
        - unit
        - scaleId
        - rawLine
        - syncStatus
        - createdAt
        - qualityIssues

    CreateWeighRecordBody:
      type: object
      properties:
        workerId:
          type: string
        timestamp:
          type: string
          format: date-time
        weightGrams:
          type: number
        unit:
          type: string
        scaleId:
          type: string
        rawLine:
          type: string
        qualityIssues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
      required:
        - workerId
        - weightGrams
        - unit
        - scaleId
        - rawLine

    UpdateWeighRecordBody:
      type: object
      properties:
        weightGrams:
          type: integer
          minimum: 50
          maximum: 10000
        qualityIssues:
          type: array
          items:
            $ref: "#/components/schemas/QualityIssue"
      required:
        - weightGrams

    QualityIssueCounts:
      type: object
      description: Per-type counts of quality occurrences
      properties:
        CALIBRE:
          type: integer
        PENDUNCULOS:
          type: integer
        VERDE:
          type: integer
        MOLE:
          type: integer
        OUTROS:
          type: integer
      required:
        - CALIBRE
        - PENDUNCULOS
        - VERDE
        - MOLE
        - OUTROS

    WorkerDailyStats:
      type: object
      properties:
        workerId:
          type: string
        workerName:
          type: string
        totalCaixas:
          type: integer
        totalKg:
          type: number
        mediaGrPorCaixa:
          type: number
        caixasPorHora:
          type: number
        hoursWorked:
          type: ["number", "null"]
          description: Hours from check-in to check-out (or now, if still working). Null if no attendance record.
        kgPorHora:
          type: ["number", "null"]
          description: totalKg / hoursWorked. Null if hoursWorked is null or zero.
        primeiroRegisto:
          type: ["string", "null"]
        ultimoRegisto:
          type: ["string", "null"]
        rankKg:
          type: integer
        totalIssues:
          type: integer
          description: Total number of quality flags reported across all boxes for this worker.
        issuesByType:
          $ref: "#/components/schemas/QualityIssueCounts"
      required:
        - workerId
        - workerName
        - totalCaixas
        - totalKg
        - mediaGrPorCaixa
        - caixasPorHora
        - hoursWorked
        - kgPorHora
        - primeiroRegisto
        - ultimoRegisto
        - rankKg
        - totalIssues
        - issuesByType

    WorkerTimesheetShift:
      type: object
      description: A single entrada/saída (shift) within a day. A day can have several.
      properties:
        id:
          type: integer
        checkInAt:
          type: ["string", "null"]
        checkOutAt:
          type: ["string", "null"]
        hoursWorked:
          type: ["number", "null"]
        pay:
          type: ["number", "null"]
          description: hoursWorked * hourlyRate for this shift (null if either is missing)
      required:
        - id
        - checkInAt
        - checkOutAt
        - hoursWorked
        - pay

    WorkerTimesheetDay:
      type: object
      properties:
        date:
          type: string
        checkInAt:
          type: ["string", "null"]
          description: First check-in of the day (aggregate over all shifts).
        checkOutAt:
          type: ["string", "null"]
          description: Last check-out of the day, or null if any shift is still open.
        hoursWorked:
          type: ["number", "null"]
          description: Sum of hoursWorked across the day's closed shifts.
        pay:
          type: ["number", "null"]
          description: hoursWorked * hourlyRate (null if either is missing)
        totalIssues:
          type: integer
          description: Number of quality flags reported on this day.
        issuesByType:
          $ref: "#/components/schemas/QualityIssueCounts"
        shifts:
          type: array
          items:
            $ref: "#/components/schemas/WorkerTimesheetShift"
      required:
        - date
        - checkInAt
        - checkOutAt
        - hoursWorked
        - pay
        - totalIssues
        - issuesByType
        - shifts

    WorkerTimesheet:
      type: object
      properties:
        workerId:
          type: string
        workerName:
          type: string
        from:
          type: string
        to:
          type: string
        hourlyRate:
          type: ["number", "null"]
        days:
          type: array
          items:
            $ref: "#/components/schemas/WorkerTimesheetDay"
        totalDays:
          type: integer
          description: Number of days with at least a check-in
        totalHours:
          type: number
        totalPay:
          type: ["number", "null"]
      required:
        - workerId
        - workerName
        - from
        - to
        - hourlyRate
        - days
        - totalDays
        - totalHours
        - totalPay

    AttendanceEntry:
      type: object
      properties:
        workerId:
          type: string
        workerName:
          type: string
        date:
          type: string
          description: ISO date YYYY-MM-DD
        checkInAt:
          type: ["string", "null"]
          format: date-time
        checkOutAt:
          type: ["string", "null"]
          format: date-time
        hoursWorked:
          type: ["number", "null"]
          description: Hours between check-in and check-out (null if not yet checked out)
      required:
        - workerId
        - workerName
        - date
        - checkInAt
        - checkOutAt
        - hoursWorked

    AttendanceMutationBody:
      type: object
      properties:
        workerId:
          type: string
        date:
          type: string
          description: ISO date YYYY-MM-DD (defaults to today)
      required:
        - workerId

    AttendanceBulkBody:
      type: object
      properties:
        date:
          type: string
          description: ISO date YYYY-MM-DD (defaults to today)
        workerIds:
          type: array
          description: Restrict the bulk action to these worker IDs (defaults to all active workers)
          items:
            type: string

    ShiftCreateBody:
      type: object
      properties:
        workerId:
          type: string
        date:
          type: string
          description: ISO date YYYY-MM-DD
        checkInAt:
          type: string
          format: date-time
        checkOutAt:
          type: ["string", "null"]
          format: date-time
      required:
        - workerId
        - date
        - checkInAt

    ShiftUpdateBody:
      type: object
      description: All fields optional; omit a field to leave it unchanged.
      properties:
        date:
          type: string
          description: Move the shift to this ISO date YYYY-MM-DD
        checkInAt:
          type: string
          format: date-time
        checkOutAt:
          type: ["string", "null"]
          format: date-time

    DailyReport:
      type: object
      properties:
        date:
          type: string
        workers:
          type: array
          items:
            $ref: "#/components/schemas/WorkerDailyStats"
        totalRecords:
          type: integer
        totalKg:
          type: number
      required:
        - date
        - workers
        - totalRecords
        - totalKg
